[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag-eval"
version = "0.1.0"
description = "Agentic RAG with an automated eval harness (tool-use agent + vector DB + Claude)"
requires-python = ">=3.11"
dependencies = [
  "qdrant-client>=1.10",
  "sentence-transformers>=3.0",
  "transformers>=4.41,<5",   # 5.x quebra o import do sentence-transformers (PreTrainedModel)
  "anthropic>=0.40",
  "litellm>=1.40",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "ragas>=0.1",
  "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "black>=24", "pre-commit>=3.7"]
ocr = ["pytesseract>=0.3", "pillow>=10"]  # + binario Tesseract no sistema (nao via pip)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
