[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag-eval"
version = "0.1.0"
description = "Agentic RAG with an automated eval harness (tool-use agent + vector DB + Claude)"
requires-python = ">=3.11"
dependencies = [
  "qdrant-client>=1.10",
  "sentence-transformers>=3.0",
  "transformers>=4.41,<5",   # 5.x quebra o import do sentence-transformers (PreTrainedModel)
  "anthropic>=0.40",
  "litellm>=1.40",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "ragas>=0.1",
  "pymupdf>=1.24",
]

[project.optional-dependencies]
# ruff com teto de versao DE PROPOSITO: `ruff>=0.5` puxava a release mais nova a cada run
# do CI, e o conjunto de regras padrao do ruff muda entre versoes minor. Resultado: o mesmo
# commit passava hoje e reprovava amanha, sem ninguem tocar no codigo. Faixa fechada = CI
# reprodutivel; subir a versao vira uma decisao explicita, com o diff de lint junto.
dev = ["pytest>=8", "ruff>=0.16,<0.17", "black>=24", "pre-commit>=3.7"]
ocr = ["pytesseract>=0.3", "pillow>=10"]  # + binario Tesseract no sistema (nao via pip)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# Depends()/Query()/etc. em argumento default e o IDIOMA do FastAPI, nao o bug que o
# B008 procura. Sem isso o CI reprova o proprio jeito certo de escrever a rota.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Header",
    "fastapi.Path", "fastapi.Body", "fastapi.File", "fastapi.Form",
]
